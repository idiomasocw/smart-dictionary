[project]
name = "smart-dictionary"
version = "0.1.0"
description = "Smart Dictionary backend: REST API, content pipeline and workers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "uuid-utils>=0.9",
    "lemminflect>=0.2.3",
    "anthropic>=1.15",
]

[project.scripts]
smart-dictionary = "smart_dictionary.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx2>=2.13.1",
]
# Only the dataset importers need these; the API image leaves them out.
data = [
    "wordfreq>=3.1",
]
audio = [
    "av>=14",
    "kokoro-onnx>=0.6.1",
]

[tool.uv]
default-groups = ["dev", "data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_dictionary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Revisions embed plain SQL, which is not wrapped to Python's line length.
"migrations/versions/*.py" = ["E501"]
# Normalization tests feed curly quotes, Arabic and full-width text on purpose.
"tests/**" = ["RUF001"]
# IPA symbols (ɑ, ʊ, ʃ…) are the data here, not look-alike typos.
"src/smart_dictionary/importers/phonetics.py" = ["RUF001", "RUF002"]
"src/smart_dictionary/audio/phonemes.py" = ["RUF001", "RUF002", "RUF003"]
"src/smart_dictionary/importers/sources.py" = ["RUF002"]
"src/smart_dictionary/factory/validate.py" = ["RUF001", "RUF002"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
