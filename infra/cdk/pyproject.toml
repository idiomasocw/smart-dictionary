[project]
name = "smart-dictionary-infra"
version = "0.1.0"
description = "AWS CDK app for the dictionary host (design §11, integration §5)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-cdk-lib==2.273.0",
    "constructs>=10.8.1,<11",
]

# No pyright here: CDK's generated bindings fail its protocol checks (ServicePrincipal vs
# IPrincipal) although the code is fine. `npx cdk synth` is the type check.
[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
