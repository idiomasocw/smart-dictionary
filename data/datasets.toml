[kaikki-en]
name = "Wiktionary English (kaikki.org wiktextract extract)"
version = "2026-10-03"
license = "CC BY-SA 4.0 and GFDL (Wiktionary); facts and internal hints only"
attribution = "Wiktionary contributors, extracted by kaikki.org / wiktextract (Tatu Ylonen)."
url = "https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl.gz"
importer = "kaikki"
# kaikki republishes this file monthly at the same URL, so it isn't sha-pinned here;
# the sha256 of the bytes actually imported is recorded in ref_datasets.
min_zipf = 3.0
min_multiword_zipf = 2.5
