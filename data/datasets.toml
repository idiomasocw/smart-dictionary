# Open datasets that ground and check the content factory (docs/03 §6.1–6.2).
#
#   uv run smart-dictionary data fetch <id>     download into data/raw/<id>/ (sha256-checked when pinned)
#   uv run smart-dictionary data import <id>    load the ref_* tables
#   uv run smart-dictionary data import --all   everything, in dependency order
#
# GitHub URLs are pinned to a commit so a re-import gets the same bytes. Licenses and
# attribution are listed in data/README.md and copied into ref_datasets on import.

[cefrj]
name = "CEFR-J Vocabulary Profile"
version = "1.5"
license = "Free for research and commercial use, with citation"
attribution = "CEFR-J Wordlist Version 1.5, compiled by Yukio Tono, Tokyo University of Foreign Studies; distributed via Open Language Profiles."
url = "https://raw.githubusercontent.com/openlanguageprofiles/olp-en-cefrj/d4e45b75b38f27b30dfc5c44d8c571aec7e7092f/cefrj-vocabulary-profile-1.5.csv"
sha256 = "b0dd3c635f1c9a4fdf1490c7e5b7c48e8bbe55b652ad0c9860a95f98e10ae498"
importer = "cefr_list"

[octanove-c1c2]
name = "Octanove Vocabulary Profile C1/C2"
version = "1.0"
license = "CC BY-SA 4.0"
attribution = "Octanove Vocabulary Profile C1/C2 1.0, Octanove Labs; distributed via Open Language Profiles."
url = "https://raw.githubusercontent.com/openlanguageprofiles/olp-en-cefrj/d4e45b75b38f27b30dfc5c44d8c571aec7e7092f/octanove-vocabulary-profile-c1c2-1.0.csv"
sha256 = "18c33a407f2f89f7b8de9671c6d45fe3ea0bce45e7d2d7dcaab48d73e0f7b380"
importer = "cefr_list"

# The NGSL family (newgeneralservicelist.com). Its official links always serve the
# current upload, so the sha256 pin turns a changed file into a failed fetch instead of
# a silent change. Only headwords, ranks and frequency statistics are imported, never
# the lists' "easy English" definitions, which are CC BY-SA text.

[ngsl]
name = "New General Service List (NGSL)"
version = "1.2"
license = "CC BY-SA 4.0"
attribution = "New General Service List 1.2 by Browne, C., Culligan, B., and Phillips, J. (newgeneralservicelist.com), CC BY-SA 4.0."
url = "https://www.newgeneralservicelist.com/s/NGSL_12_stats.csv"
sha256 = "2098bab8955a120a9766c6282a51d7d578c6cb0a7d946600d2ffb73ba25a0b44"
importer = "ranked_list"
lemma_column = "Lemma"
rank_column = "SFI Rank"

[ngsl-sup]
name = "NGSL supplementary words (days, months, numbers)"
# The site gives the supplement no version number; this is the file's upload date.
version = "2023-05-13"
license = "CC BY-SA 4.0"
attribution = "NGSL supplementary words, part of the New General Service List by Browne, C., Culligan, B., and Phillips, J. (newgeneralservicelist.com), CC BY-SA 4.0."
url = "https://www.newgeneralservicelist.com/s/SUP_lemmatized.csv"
sha256 = "7bb4c76cbe43ae87240be4ac7ada370b9e1a0d9d631d8c4430138646965d03f6"
importer = "word_family"

[ngsl-spoken]
name = "New General Service List-Spoken (NGSL-S)"
version = "1.2"
